# SmartDex Windows packaging (electron-builder).
#
# Bundled binaries are staged by scripts/fetch-binaries.js into
# windows-app/resources/, then packaged via extraResources so they land at
# <install>/resources/<path> — exactly where the main process looks:
#   resources/bin/adb/adb.exe        (see src/main/adb.ts)
#   resources/bin/scrcpy/scrcpy.exe  (see src/main/scrcpy.ts)
#   resources/apk/smartdex-helper.apk (see src/main/helper.ts;
#                                      delivered by the Android agent)
#
# NOTE: no code signing. The installer is unsigned, so Windows SmartScreen
# will show a warning on first run ("Windows protected your PC" -> More info ->
# Run anyway). Documented in README.md; see docs/TESTING.md.

appId: com.smartdex.app
productName: SmartDex

directories:
  output: dist
  app: .

files:
  - dist/**/*
  - package.json

extraResources:
  - from: resources
    to: "."
    filter:
      - bin/**/*
      - apk/**/*
    # apk/ may not exist yet (the Android agent delivers smartdex-helper.apk);
    # empty filter matches are fine and do not fail the build.

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: SmartDex
  createDesktopShortcut: true
  createStartMenuShortcut: true
